<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <h2 id="form-title" style="margin-bottom: 1.5rem;">Login</h2>
            
            <form onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" id="submit-btn" class="btn" style="width: 100%;">Login</button>
                
                <p id="error-msg" class="error-msg"></p>
                <p id="success-msg" style="color: #10b981; font-size: 0.8rem; margin-top: 1rem; display: none;"></p>
            </form>
            
            <p style="margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
                <span id="toggle-text">New here?</span> 
                <a href="#" onclick="toggleMode()" style="color: var(--primary); font-weight: 600;">
                    <span id="toggle-link">Create an account</span>
                </a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
