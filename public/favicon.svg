<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffa3" />
      <stop offset="60%" stop-color="#00e87a" />
      <stop offset="100%" stop-color="#c8ff00" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e87a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c8ff00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00e87a" stop-opacity="0.15" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Micro Grid Pattern -->
  <line x1="5" y1="35" x2="95" y2="35" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="5" y1="65" x2="95" y2="65" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="35" y1="5" x2="35" y2="95" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="65" y1="5" x2="65" y2="95" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- AK Monogram -->
  <g filter="url(#neonGlow)">
    <!-- 'A' Left Leg & Peak -->
    <path d="M 23 74 L 41 26 L 52 52" fill="none" stroke="url(#neonEmerald)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 'A' Crossbar -->
    <path d="M 30 56 L 47 56" fill="none" stroke="url(#neonEmerald)" stroke-width="5" stroke-linecap="round" />

    <!-- 'K' Vertical Spine -->
    <path d="M 58 26 L 58 74" fill="none" stroke="url(#neonEmerald)" stroke-width="6.5" stroke-linecap="round" />
    <!-- 'K' Diagonal Arms -->
    <path d="M 78 28 L 59 49 L 78 74" fill="none" stroke="url(#neonEmerald)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Pulse Dot -->
    <circle cx="82" cy="24" r="3.5" fill="#c8ff00" />
  </g>
</svg>